<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>봄의 정원</title>
    <meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <!-- use-credentials = Access 로그인 쿠키를 실어야 앱 설명서를 받음(없으면 로그인 창으로 튕겨 설치 불가) -->
    <link rel="manifest" href="/office-app/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/office-app/favicon.ico?v=sprout1114" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/office-app/favicon-32.png?v=sprout1114" />
    <link rel="apple-touch-icon" sizes="180x180" href="/office-app/apple-touch-icon.png?v=sprout1114" />
    <!-- 첫 그림 전 밝음·어두움(원본 index.html 그대로 · 규칙 = upstream/app/src/lib/theme.ts) -->
    <script>
      (() => {
        let choice = null;
        try {
          choice = window.localStorage.getItem("openduet-theme");
          const lg = window.localStorage.getItem("openbot-theme");
          if (choice === null && lg === "dark") choice = "dark";
          if (choice === null && lg === "light") choice = "system";   /* 옛 OpenBot 기본값 = 기기 따라 그대로(src/lib/theme.ts) */
        } catch {}
        const dark =
          choice === "dark" ||
          choice === null ||   /* 아무것도 안 고른 기기 = 어두운 판(형 11-12 08:33 · src/lib/theme.ts 와 같은 셈) */
          (choice !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        // 꾸밈(지금 / 정원) — 첫 그림 전에 붙여 깜빡임 0 · 고르기 = 설정 「꾸밈」(ui/skin.ts · 형 11-07 「지금테마랑 정원테마 고를 수 있게해줘」)
        try { if (window.localStorage.getItem("nomute-skin") === "garden") document.documentElement.dataset.theme = "garden"; } catch {}
        // 자동 새로고침 화면(형 11-07 11:21 「먹색 챠콜검정화면 …」 · 13:23 「점세개 모션으로 그냥 아예 대체하셈」) = 다시 읽기 1분 안이면 첫 그림 전부터(main.tsx 가 1.5초 뒤 걷음)
        try { const u = +(window.sessionStorage.getItem("nm-updating") || 0); if (u && Date.now() - u < 60000) document.documentElement.classList.add("nm-updating"); } catch {}
      })();
    </script>
    <style>
      /* 업데이트 중 화면(형 11-07 11:21) — 먹색(차콜) 바탕 · 앱 로딩 화면 위를 덮음
         형 11-07 13:23 「그리고 이거 투박해 점세개 모션으로 그냥 아예 대체하셈,」 = 글 뺌 · 가운데 라임 점 셋이 차례로 밝아짐(::after = 바탕 · ::before = 가운데 점 + 양옆 점 그림자) */
      html.nm-updating, html.nm-updating body { background:#1b1c1e !important; }
      html.nm-updating body::after { content:""; position:fixed; inset:0; z-index:2147483646; background:#1b1c1e; }
      html.nm-updating body::before { content:""; position:fixed; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; z-index:2147483647; animation:nmUpdDots 1.2s ease-in-out infinite; }
      @keyframes nmUpdDots {
        0%, 100% { background:rgba(207,255,64,.22); box-shadow:-18px 0 0 #CFFF40, 18px 0 0 rgba(207,255,64,.22); }
        33% { background:#CFFF40; box-shadow:-18px 0 0 rgba(207,255,64,.22), 18px 0 0 rgba(207,255,64,.22); }
        66% { background:rgba(207,255,64,.22); box-shadow:-18px 0 0 rgba(207,255,64,.22), 18px 0 0 #CFFF40; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
